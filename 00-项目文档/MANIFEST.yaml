# ============================================================
# 协作角色与职责（控制流）
# ============================================================
roles:
  autoclaw:
    name: 生产 AI（另一台电脑）
    responsibility: 读规范 v1.0 + MANIFEST → 按概念清单产 JSON → 写 MANIFEST → 跑校验 → 推 Git
    can_do:
      - 产出新卡片（按 MANIFEST 的 pending 列表）
      - 标记 in_progress（开始干）
      - 标记 done（完成）
      - 跑 _validate_cards.py 校验
      - 推 Git
    cannot_do:
      - 修改规范 v1.0
      - 修改其他 autoclaw 产出的卡片
      - 直接推 rujing（这是本机 Mavis 的活）
      - 决定 status 升级（draft → trial → certified）

  mavis:
    name: 本机管家
    responsibility: pull Git → 跑校验 → 同步 MANIFEST 质量数据 → 报告差异 → 推 rujing
    can_do:
      - git pull / push
      - 跑 _validate_cards.py
      - 更新 MANIFEST 的 last_sync + pass_rate
      - 推 rujing（消费端）
      - 修 _tools 路径（与新仓库结构对齐）
    cannot_do:
      - 修改 autoclaw 产出的卡片内容
      - 决定 status 升级
      - 改规范 v1.0

  willi:
    name: 决策者
    responsibility: 拍板规范迭代、跨学科扩展、是否入库/上架、版本号
    can_do:
      - 修改规范 v1.0
      - 决定 status 升级（draft → trial → certified）
      - 决定推 rujing 时机
      - 决定跨学科扩展
    cannot_do:
      - 替 autoclaw 写卡片（除非 autoclaw 跑不动）
      - 直接改 Mavis 推过的 rujing 数据

# ============================================================
# 工作流（控制流机制）
# ============================================================
workflow:
  - step: 1_pull_manifest
    actor: autoclaw
    action: 拉 Git 读 MANIFEST
    output: 知道 done / in_progress / pending

  - step: 2_mark_in_progress
    actor: autoclaw
    action: 把要做的概念在 MANIFEST 标 in_progress
    output: 防止重复生产

  - step: 3_produce_cards
    actor: autoclaw
    action: 按规范 v1.0 产 1 套 JSON
    output: 历史/cards/2026-XX-XX_xxx/ 目录

  - step: 4_local_validate
    actor: autoclaw
    action: 跑 _validate_cards.py 校验
    output: PASS / FAIL

  - step: 5_mark_done
    actor: autoclaw
    action: 改 MANIFEST done=true + 时间戳
    output: MANIFEST 同步

  - step: 6_push_git
    actor: autoclaw
    action: git commit + push
    output: 远端 main 更新

  - step: 7_pull
    actor: mavis
    action: 本机 git pull
    output: 本地拿到新卡

  - step: 8_validate
    actor: mavis
    action: 跑 _validate_cards.py
    output: PASS / FAIL

  - step: 9_update_manifest
    actor: mavis
    action: 更新 MANIFEST 的 last_sync + pass_rate
    output: MANIFEST 质量数据更新

  - step: 10_ship_to_rujing
    actor: mavis
    action: 通过 ru_cardpkg_convert.py 推 rujing
    output: rujing APP 收到卡

  - step: 11_mark_shipped
    actor: mavis
    action: MANIFEST 标 shipped_to_rujing + rujing_card_ids
    output: MANIFEST 闭环

