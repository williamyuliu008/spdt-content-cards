# MANIFEST.yaml — 内容项目全局索引
# 用途：autoclaw（生产 AI）和 Mavis（本机管家）共同读写的"项目状态契约"
# 更新规则：
#   - autoclaw：标 in_progress（开始干）→ 改 done（完成）→ 推 Git
#   - Mavis：跑校验后更新 last_sync + pass_rate
#   - willi：浏览一眼掌握全局
#
# 注意：手动编辑时保持 YAML 格式，缩进用 2 空格

